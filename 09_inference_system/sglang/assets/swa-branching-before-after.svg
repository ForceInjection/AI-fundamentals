<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470">
  <defs>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family: 'Courier New','SF Mono','Menlo',monospace; }
    </style>
  </defs>

  <rect x="16" y="12" width="888" height="446" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)"/>

  <text x="460" y="48" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">分叉点缓存改了什么：从反复重算到一次钉住</text>

  <!-- ================= Left panel: before ================= -->
  <rect x="40" y="70" width="410" height="356" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="245" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#B91C1C">#34565 之前</text>
  <text x="245" y="118" text-anchor="middle" font-size="12" fill="#64748B">缺口没有任何机制去补</text>

  <!-- request B -->
  <rect x="60" y="136" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="104" y="152" text-anchor="middle" font-size="12" fill="#334155">请求 B 到达</text>
  <rect x="160" y="136" width="130" height="24" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="225" y="152" text-anchor="middle" font-size="11.5" fill="#B91C1C">重算分叉点的窗口</text>
  <rect x="302" y="136" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="367" y="152" text-anchor="middle" font-size="11.5" fill="#94A3B8">窗口随后又被释放</text>

  <!-- loop arrow -->
  <path d="M 367 172 C 367 212, 104 212, 104 178" stroke="#DC2626" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  <polygon points="104,172 100,182 109,182" fill="#DC2626"/>
  <text x="236" y="192" text-anchor="middle" font-size="11.5" fill="#DC2626">下一个分叉请求照样重算</text>

  <!-- request C -->
  <rect x="60" y="228" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="104" y="244" text-anchor="middle" font-size="12" fill="#334155">请求 C 到达</text>
  <rect x="160" y="228" width="130" height="24" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="225" y="244" text-anchor="middle" font-size="11.5" fill="#B91C1C">再算一模一样的窗口</text>
  <rect x="302" y="228" width="130" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="367" y="244" text-anchor="middle" font-size="11.5" fill="#94A3B8">再释放</text>

  <!-- cost summary -->
  <rect x="60" y="288" width="372" height="56" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="76" y="311" font-size="12.5" font-weight="600" fill="#B91C1C">代价随分叉请求数线性增长</text>
  <text x="76" y="331" font-size="11.5" fill="#DC2626">分叉请求有多少，这笔重算就付多少次</text>

  <text x="245" y="398" text-anchor="middle" font-size="11.5" fill="#94A3B8">命中率基线：43.8%（官方口径）</text>

  <!-- ================= Right panel: after ================= -->
  <rect x="470" y="70" width="410" height="356" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="675" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">#34565 之后</text>
  <text x="675" y="118" text-anchor="middle" font-size="12" fill="#64748B">首个请求把窗口钉进树</text>

  <!-- request A -->
  <rect x="490" y="136" width="96" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="538" y="152" text-anchor="middle" font-size="12" fill="#334155">首个请求前向</text>
  <rect x="598" y="136" width="264" height="24" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="730" y="152" text-anchor="middle" font-size="11.5" fill="#065F46">插入边界推到分叉点，窗口写进树</text>

  <!-- arrow down -->
  <line x1="675" y1="166" x2="675" y2="186" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="675,192 671,183 679,183" fill="#10B981"/>

  <!-- request B -->
  <rect x="490" y="196" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="534" y="212" text-anchor="middle" font-size="12" fill="#334155">请求 B 到达</text>
  <rect x="590" y="196" width="272" height="24" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="726" y="212" text-anchor="middle" font-size="11.5" fill="#065F46">✓ 命中窗口，跳过这段重算</text>

  <!-- request C -->
  <rect x="490" y="232" width="88" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="534" y="248" text-anchor="middle" font-size="12" fill="#334155">请求 C 到达</text>
  <rect x="590" y="232" width="272" height="24" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1.2"/>
  <text x="726" y="248" text-anchor="middle" font-size="11.5" fill="#065F46">✓ 同一位置分叉，直接命中</text>

  <!-- benefit summary -->
  <rect x="490" y="288" width="372" height="56" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="506" y="311" font-size="12.5" font-weight="600" fill="#047857">一次物化，后续每个分叉请求复用</text>
  <text x="506" y="331" font-size="11.5" fill="#059669">树里只多存一个窗口，收益随请求数摊薄</text>

  <text x="675" y="398" text-anchor="middle" font-size="11.5" fill="#94A3B8">命中率：60.8%，TTFT 1.57 s → 1.07 s（官方口径）</text>

  <!-- divider -->
  <line x1="460" y1="86" x2="460" y2="410" stroke="#E2E8F0" stroke-width="1"/>

  <text x="460" y="442" text-anchor="middle" font-size="11.5" fill="#94A3B8">两个数字均为 DeepSeek-V4-Flash + 共享 system prompt 场景下的官方自测口径，口径边界见正文 §5.4。</text>
</svg>
