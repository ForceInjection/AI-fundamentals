<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGLang 推理流水线 — Prefill & Decode + HiCache</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d; --text:#c9d1d9; --dim:#8b949e;
    --accent:#58a6ff; --green:#3fb950; --orange:#d2991d; --purple:#a371f7; --red:#f85149; --cyan:#39c5cf; --pink:#f778ba;
    --c-input:#58a6ff; --c-qkv:#f778ba; --c-cache:#3fb950; --c-out:#f85149;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  a { color:var(--cyan); text-decoration:none; } a:hover { text-decoration:underline; }

  /* ── LEFT PANEL ── */
  .left { flex:1; display:flex; flex-direction:column; border-right:1px solid var(--border); min-width:580px; }
  .lhead { padding:10px 16px; font-size:13px; font-weight:700; border-bottom:1px solid var(--border); background:var(--surface); display:flex; align-items:center; gap:8px; }
  .lhead .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }

  .tabs { display:flex; gap:2px; padding:6px 12px; border-bottom:1px solid var(--border); background:var(--surface); }
  .tabs button { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--dim); font-size:12px; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  .viz { flex:1; display:flex; flex-direction:column; align-items:center; padding:66px 20px 16px 20px; overflow-y:auto; min-height:0; }

  /* Step badge */
  .step-badge {
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px;
    background:var(--accent); color:#fff; margin-bottom:10px;
    font-family:'SF Mono',monospace;
  }

  /* Stable layout: fixed heights prevent content jumping between steps */
  .pipe-area { min-height: 52px; display:flex; align-items:center; }
  .qpanel-area { min-height: 0; }
  .qpanel-area .placeholder { display:none; }
  .sinfo-area { min-height: 80px; display:flex; align-items:flex-start; justify-content:center; }
  .tokens-area { min-height: 48px; display:flex; align-items:center; justify-content:center; }

  /* Pipeline boxes */
  .pipe { display:flex; align-items:flex-start; gap:0; justify-content:center; }
  .sbox {
    display:flex; flex-direction:column; align-items:center;
    border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    min-width:95px; max-width:130px; background:var(--surface); transition:all 0.3s; text-align:center;
  }
  .sbox.on { border-color:var(--accent); box-shadow:0 0 12px rgba(88,166,255,0.2); }
  .sbox.hi { border-color:var(--red); border-width:2px; background:rgba(248,81,73,0.04); }
  .sbox .ico { font-size:20px; margin-bottom:2px; }
  .sbox .lb { font-size:10px; font-weight:700; }
  .sbox .dt { font-size:9px; color:var(--dim); margin-top:2px; line-height:1.3; }
  .arr { display:flex; align-items:center; font-size:16px; color:var(--cyan); padding:0 2px; margin-top:16px; font-weight:700; flex-shrink:0; }

  /* HiCache query panel */
  .qpanel {
    border:2px dashed var(--red); border-radius:12px; padding:14px 20px;
    margin-top:14px; background:rgba(248,81,73,0.03); max-width:700px; width:100%;
    display:flex; flex-direction:column; align-items:center;
  }
  .qpanel .qp-title { font-size:12px; font-weight:700; color:var(--red); margin-bottom:8px; }
  .qlayers { display:flex; gap:10px; align-items:flex-start; }
  .qly {
    border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:10px;
    text-align:center; min-width:75px; background:var(--surface); transition:all 0.3s;
  }
  .qly.on { border-color:var(--accent); box-shadow:0 0 8px rgba(88,166,255,0.3); }
  .qly .qn { font-weight:700; font-size:11px; }
  .qly .qs { font-size:10px; margin-top:2px; }
  .qly .hit { color:var(--green); }
  .qly .miss { color:var(--red); }
  .qly .na { color:var(--dim); }
  .qarr { color:var(--dim); font-size:16px; margin-top:12px; font-weight:700; }

  /* RadixTree */
  .rtree { display:flex; gap:1px; align-items:center; margin:6px 0; font-family:'SF Mono',monospace; font-size:10px; }
  .rn { padding:2px 6px; border-radius:3px; border:1px solid var(--border); background:var(--surface); }
  .rn.ok { border-color:var(--green); background:rgba(63,185,80,0.12); color:var(--green); }
  .rn.cur { border-color:var(--accent); background:rgba(88,166,255,0.12); color:var(--accent); }
  .rn.ny { border-color:var(--red); background:rgba(248,81,73,0.08); }
  .rarr { color:var(--dim); margin:0 1px; }

  /* Token groups (for QKV step) */
  .tgrp {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; transition: all 0.3s;
  }
  .tgrp .tlbl { font-size: 9px; font-weight: 700; font-family: 'SF Mono',monospace; }
  .tgrp .trow { display: flex; gap: 2px; }
  .tgrp .tqk {
    width: 16px; height: 16px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 7px; font-weight: 700; font-family: 'SF Mono',monospace;
  }
  .tqk.q { background: var(--c-qkv); color: #000; }
  .tqk.k { background: var(--c-cache); color: #000; }
  .tqk.v { background: var(--c-out); color: #fff; }
  .tarr { display: flex; align-items: center; color: var(--cyan); font-size: 10px; font-weight: 700; margin: 0 1px; }

  /* Flat tokens (non-group steps) */
  .toks { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; margin:8px 0; align-items:center; }
  .tok {
    width:30px; height:30px; border-radius:5px; display:flex; align-items:center;
    justify-content:center; font-size:10px; font-weight:700; font-family:'SF Mono',monospace; transition:all 0.3s;
  }
  .tok.ti { background:var(--c-input); color:#000; }
  .tok.tq { background:var(--c-qkv); color:#000; }
  .tok.tk { background:var(--c-cache); color:#000; }
  .tok.to { background:var(--c-out); color:#fff; }

  .sinfo {
    margin-top:10px; padding:10px 16px; border-radius:8px; background:var(--surface);
    border:1px solid var(--border); max-width:700px; text-align:center; font-size:12px; line-height:1.7;
  }
  .sinfo .m { color:var(--purple); font-family:'SF Mono',monospace; font-size:11px; }
  .sinfo .fm { color:var(--dim); font-family:'SF Mono',monospace; font-size:10px; }
  .sinfo ul { text-align:left; margin:6px 0 0 0; padding-left:18px; line-height:1.8; }
  .sinfo li { font-size:11px; }

  .ctrls { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--border); background:var(--surface); align-items:center; }
  .btn { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.go { background:var(--accent); color:#fff; border-color:var(--accent); }
  .spd { margin-left:auto; font-size:11px; color:var(--dim); display:flex; gap:6px; align-items:center; }
  .spd select { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:2px 6px; font-size:11px; }

  /* ── RIGHT PANEL ── */
  .right { width:480px; display:flex; flex-direction:column; background:var(--surface); overflow-y:auto; }
  .right h3 { padding:10px 16px; font-size:13px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1; }
  .hibar { margin:8px 16px; padding:8px 12px; border-radius:6px; border:1px dashed var(--red); background:rgba(248,81,73,0.05); font-family:'SF Mono',monospace; font-size:11px; display:none; }
  .hibar .ht { color:var(--red); font-weight:700; }
  .hibar .ok { color:var(--green); }
  .hibar .no { color:var(--red); }

  .tree { padding:8px 12px 20px; font-family:'SF Mono',monospace; font-size:11px; }
  .tn { margin-left:16px; border-left:1px solid var(--border); padding-left:10px; }
  .tn-h { display:flex; align-items:center; gap:5px; padding:3px 6px; border-radius:4px; cursor:pointer; transition:all 0.15s; }
  .tn-h:hover { background:rgba(88,166,255,0.06); }
  .tn-h.hl { background:rgba(88,166,255,0.14); border:1px solid rgba(88,166,255,0.35); }
  .tn-h .tg { font-size:9px; color:var(--dim); width:10px; flex-shrink:0; }
  .tn-h .nm { color:var(--purple); font-weight:600; }
  .tn-h .fl { color:var(--dim); font-size:9px; }
  .tn-h .ph { font-size:8px; padding:1px 5px; border-radius:3px; font-weight:700; }
  .ph.prefill { background:rgba(88,166,255,0.2); color:var(--accent); }
  .ph.decode { background:rgba(210,153,29,0.2); color:var(--orange); }
  .ph.both { background:rgba(163,113,247,0.2); color:var(--purple); }
  .tn-h .gh { color:var(--cyan); font-size:9px; margin-left:auto; flex-shrink:0; }

  @media(max-width:1150px){ body{flex-direction:column;} .right{width:100%;max-height:35vh;} .left{min-width:0;} }
</style>
</head>
<body>

<!-- ═════════ LEFT ═════════ -->
<div class="left">
  <div class="lhead"><div class="dot"></div> SGLang 推理流水线 — Prefill & Decode + HiCache</div>
  <div class="tabs" id="tabs">
    <button class="on" data-s="prefill">Prefill Stage</button>
    <button data-s="decode">Decode Stage</button>
  </div>
  <div class="viz" id="viz"></div>
  <div class="ctrls">
    <button class="btn" onclick="prev()">◀ 上一步</button>
    <button class="btn" onclick="step()">下一步 ▶</button>
    <button class="btn" onclick="reset()">↺ 重置</button>
  </div>
</div>

<div class="right">
  <h3>📋 SGLang 方法调用栈</h3>

  <div class="tree" id="tree"></div>
</div>

// ═══ Render ═══
let cur='prefill', idx=0;
const SPD=400; // unused now but keep for reference

function buildTree(nodes){
  function r(ns){
    let h='';
    for(const n of ns){
      const kids=n.c&&n.c.length;
      h+=`<div class="tn"><div class="tn-h" data-m="${n.m}">
        <span class="tg">${kids?'▾':'·'}</span>
        <span class="nm">${n.m}()</span><span class="fl">${n.f}:${n.l}</span>
        <span class="ph ${n.p}">${n.p}</span>
        ${n.l!=='—'?`<a class="gh" href="${GH}/${n.f}${n.l!=='—'?'#L'+n.l:''}" target="_blank" onclick="event.stopPropagation()">↗</a>`:''}
      </div>`;
      if(kids) h+=r(n.c);
      h+='</div>';
    }
    return h;
  }
  return r(nodes);
}

function hl(list){
  document.querySelectorAll('.tn-h').forEach(e=>{
    e.classList.toggle('hl', list&&list.includes(e.dataset.m));
    if(list&&list.includes(e.dataset.m)) e.scrollIntoView({behavior:'smooth',block:'center'});
  });
}

function render(s){
  const boxIcons=['🧩','🔄','🔍','⚡','💾','✅'];
  const boxLabels=['Tokenize','QKV / Attention','HiCache 查询','Forward 计算','Write-back','完成'];
  // 🔍 红框仅当步骤自身就是 HiCache 查询步骤时高亮 (onBox===2)，write-back 不高亮
  const isHiStep = s.onBox === 2;
  const boxesHTML = boxLabels.map((lb,i)=>
    `<div class="sbox${s.onBox===i?' on':''}${i===2 && isHiStep?' hi':''}"><div class="ico">${boxIcons[i]}</div><div class="lb">${lb}</div></div>`
  ).join('<span class="arr">→</span>');

  // HiCache panel
  let qpanel='';
  if(s.hiLv>=0){
    // hiLv=0: L1 MISS → 下沉查L2  |  hiLv=1: L2 HIT → 恢复到L1
    const tierStatus = [
      s.hiLv===0 ? '<span class="miss">MISS ↓</span>' : '<span class="na">—</span>',
      s.hiLv===1 ? '<span class="hit">HIT ✓</span>' : s.hiLv===0 ? '<span class="miss">?</span>' : '<span class="na">—</span>',
      '<span class="na">—</span>',
    ];
    const lvls=[
      {n:'L1 · GPU HBM',c:'var(--c-cache)'},
      {n:'L2 · CPU RAM',c:'var(--orange)'},
      {n:'L3 · NVMe File',c:'var(--purple)'}
    ];
    const lhtml = lvls.map((l,i)=>`<div class="qly${s.hiLv===i?' on':''}"><div class="qn" style="color:${l.c}">${l.n}</div><div class="qs">${tierStatus[i]}</div></div>`).join(`<span class="qarr">${s.hiLv>=0?'⬇':''}</span>`);

    // RadixTree: root → He → llo → , → world → !
    const rnodes=['root','He','llo',',',' world','!'];
    const rhtml = rnodes.map((t,i)=>{
      let cls=''; if(s.hiRadix>=0&&i<=s.hiRadix) cls='ok'; else if(i===s.hiRadix+1) cls='cur'; else if(s.hiRadix>=0&&i>s.hiRadix+1) cls='ny';
      return `${i>0?'<span class="rarr">→</span>':''}<span class="rn${cls?' '+cls:''}">${t}</span>`;
    }).join('');

    qpanel=`<div class="qpanel">
      <div class="qp-title">🔍 HiCache 三级查询: Q → KV Cache</div>
      <div class="rtree">${rhtml}</div>
      <div style="font-size:10px;color:var(--dim);margin:4px 0 8px;">RadixTree: ${s.hiRadix>=0?`前 ${s.hiRadix} 个命中(🟢), 第 ${s.hiRadix+1} 个终止(🔵), 后续不再查询(🔴)`:''}</div>
      <div class="qlayers">${lhtml}</div>
      <div style="font-size:10px;color:var(--dim);margin-top:6px;line-height:1.6;">
        ${s.hiLv===0?`<b>Phase 1 — RadixTree 元数据遍历</b><br>逐 token 检查 evicted/backuped 标志, 无 I/O`:
          s.hiLv===1?`<b>Phase 2 — HiCache 数据恢复</b><br>对 evicted+backuped 的节点执行 load_back (L2→L1 DMA)`:
          ''}
      </div>
      <div style="font-size:9px;color:var(--dim);margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
        page_size=<b>1</b> (逐token) · prefetch_threshold=<b>256</b> (L3预取最小前缀长度) · mamba_track_interval=<b>256</b>
      </div>
    </div>`;
  }

  document.getElementById('viz').innerHTML=`
    <div class="step-badge">Step ${s.id}</div>
    <div class="pipe-area"><div class="pipe">${boxesHTML}</div></div>
    <div class="qpanel-area">${qpanel || '<span class="placeholder">—</span>'}</div>
    <div class="sinfo-area"><div class="sinfo"><strong>${s.title}</strong><br>${s.desc}</div></div>
    <div class="tokens-area">
    ${s.groups ? `
    <div class="toks">
      ${s.groups.map((g,i,a)=>`
        ${i>0?'<div class="tarr">→</div>':''}
        <div class="tgrp">
          <div class="tlbl">${g.lbl}</div>
          <div class="trow">
            ${g.qkv.map(x=>`<div class="tqk ${x.c}" title="${g.lbl} ${x.t}">${x.t}</div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
    ` : `
    <div class="toks">${s.tokens.map(t=>`<div class="tok ${t.c}">${t.t}</div>`).join('')}</div>
    `}
    </div>`
  ;
}

function show(){
  const s=STEPS[cur][idx]; render(s); hl(s.hl);
  const bar=document.getElementById('hibar'), msg=document.getElementById('himsg');
  if(s.himsg){ bar.style.display='block'; msg.innerHTML=s.himsg; }
  else bar.style.display='none';
}

function swStage(s){
  cur=s; idx=0;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.getElementById('tree').innerHTML=buildTree(TREE);
  document.getElementById('hibar').style.display='none';
  show();
}

function step(){ idx=(idx+1)%STEPS[cur].length; show(); }
function prev(){ idx=(idx-1+STEPS[cur].length)%STEPS[cur].length; show(); }
function reset(){ idx=0; document.getElementById('hibar').style.display='none'; show(); }
document.getElementById('tabs').addEventListener('click',e=>{ if(e.target.dataset.s) swStage(e.target.dataset.s); });
swStage('prefill');
</script>
