<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <defs>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <style>
      text { font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family: 'SF Mono','Menlo','Courier New',monospace; }
    </style>
  </defs>

  <rect x="16" y="12" width="928" height="596" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)"/>

  <text x="480" y="46" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#1F2937">借来的 KV 不能全借：只重算敏感层</text>
  <text x="480" y="74" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6B7280">整段原样借会掉一半以上精度；把关键层挑出来重算、其余直接复用——跨模型对平均约 11% 的层需要重算</text>

  <!-- sender / receiver -->
  <rect x="28" y="100" width="290" height="64" rx="8" fill="#EBF3FE" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="173" y="122" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#1D4ED8">发送方（sender 权重）</text>
  <text x="173" y="144" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#374151">已算好的逐层 KV ＋ transition 层 E cache</text>

  <line x1="318" y1="132" x2="640" y2="132" stroke="#9CA3AF" stroke-width="1.5"/>
  <polygon points="634,127 646,132 634,137" fill="#9CA3AF"/>
  <text x="480" y="116" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6B7280">KV ＋ 单层 E cache（transition 层）</text>
  <text x="480" y="150" text-anchor="middle" dominant-baseline="central" font-size="9" fill="#9CA3AF">传输与重算以独立 CUDA Stream 流水</text>

  <rect x="642" y="100" width="290" height="64" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="787" y="122" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="700" fill="#B45309">接收方（receiver 权重）</text>
  <text x="787" y="144" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#374151">只重算关键层，其余直接复用 sender 的 KV</text>

  <!-- layer strip -->
  <text x="480" y="188" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6B7280">接收方的逐层处理：<tspan fill="#1D4ED8" font-weight="700">蓝色 = 直接复用</tspan> · <tspan fill="#B45309" font-weight="700">琥珀 = 重算（关键层）</tspan></text>

  <rect x="60"  y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="90"  y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="120" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="150" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="180" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="210" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="240" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="270" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="300" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="330" y="204" width="30" height="64" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="360" y="204" width="30" height="64" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="390" y="204" width="30" height="64" fill="#FDE68A" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="420" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="450" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="480" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="510" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="540" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="570" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="600" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="630" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="660" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="690" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="720" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="750" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="780" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="810" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="840" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>
  <rect x="870" y="204" width="30" height="64" fill="#BFDBFE" stroke="#93C5FD" stroke-width="1"/>

  <text x="52" y="242" text-anchor="end" dominant-baseline="central" font-size="9.5" fill="#9CA3AF">L1</text>
  <text x="908" y="242" dominant-baseline="central" font-size="9.5" fill="#9CA3AF">L32</text>

  <line x1="330" y1="278" x2="420" y2="278" stroke="#F59E0B" stroke-width="1.4"/>
  <line x1="330" y1="274" x2="330" y2="282" stroke="#F59E0B" stroke-width="1.4"/>
  <line x1="420" y1="274" x2="420" y2="282" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="375" y="296" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#92400E">连续层组（≈11%）</text>

  <!-- notes -->
  <rect x="28" y="316" width="440" height="80" rx="8" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="248" y="338" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#374151">离线 profile：在 Pareto 前沿上按容差选点</text>
  <text x="248" y="362" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#6B7280">逐组枚举「重算层数 vs 质量」，选重算最少、质量压在容差内的一档</text>
  <text x="248" y="382" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#6B7280">默认容差 5%（在线实验 1%）· 每个模型对一次，0.375–3.6 小时</text>

  <rect x="492" y="316" width="440" height="80" rx="8" fill="#FAFBFC" stroke="#E5E7EB" stroke-width="1"/>
  <text x="712" y="338" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#374151">为什么必须连续</text>
  <text x="712" y="362" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#6B7280">连续层组只引入一次 E cache 加载；分散重算会叠加多个</text>
  <text x="712" y="382" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#6B7280">transition 点的偏差——「连续」是精度条件，不是实现细节</text>

  <!-- banner -->
  <rect x="28" y="412" width="904" height="84" rx="10" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="480" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#92400E">账本：预填充延迟降 1.7–3.1× · 在线吞吐 2–4× · 质量压进容差（5% / 1%）</text>
  <text x="480" y="460" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#92400E">关键层名单跨输入稳定（profile 跨数据集泛化，最大差 4 分）——但只适用同基座模型对，跨基座仍未解</text>
  <text x="480" y="482" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#92400E">收益对网络带宽敏感（64 Gbps 时优势收窄），质量承诺是「容差内」而非无损</text>

  <text x="480" y="536" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9CA3AF">DroidSpeak（NSDI '26，pp.319–338）· 8 对模型 × 3 数据集 · 无公开代码仓库</text>
  <text x="480" y="562" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#9CA3AF">口径见总纲 §七「数字怎么读」· 机制细节与行号以单篇精读为准</text>
</svg>
