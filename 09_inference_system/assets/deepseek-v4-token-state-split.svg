<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 464" width="920" height="464">
  <defs>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif; }
      .mono { font-family: 'Courier New','SF Mono','Menlo',monospace; }
    </style>
  </defs>

  <rect x="16" y="12" width="888" height="436" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#card-shadow)"/>

  <text x="460" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">一个 token 的状态，被拆成了四类</text>
  <text x="460" y="76" text-anchor="middle" font-size="13" fill="#64748B">压缩之后，一份连续张量变成了一组异构池；其中最后一类不是 KV</text>

  <!-- source bar -->
  <rect x="60" y="98" width="800" height="32" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="460" y="119" text-anchor="middle" font-size="12.5" fill="#4338CA">一个 token 在某一层的全部状态</text>

  <!-- split arrows -->
  <line x1="160" y1="134" x2="160" y2="180" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="360" y1="134" x2="360" y2="180" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="560" y1="134" x2="560" y2="180" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="760" y1="134" x2="760" y2="180" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- category headers -->
  <text x="160" y="202" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">压缩主 KV</text>
  <text x="360" y="202" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">indexer K</text>
  <text x="560" y="202" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E40AF">SWA KV（未压缩）</text>
  <text x="760" y="202" text-anchor="middle" font-size="12.5" font-weight="600" fill="#B91C1C">压缩器滚动状态</text>

  <!-- pool boxes -->
  <rect x="70" y="222" width="180" height="96" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="160" y="254" text-anchor="middle" font-size="12.5" class="mono" fill="#1E3A8A">c4 / c128</text>
  <text x="160" y="280" text-anchor="middle" font-size="11.5" fill="#1E40AF">ratio 4 / 128 压缩后</text>
  <text x="160" y="302" text-anchor="middle" font-size="11.5" fill="#1E40AF">的主 KV</text>

  <rect x="270" y="222" width="180" height="96" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="360" y="254" text-anchor="middle" font-size="12.5" class="mono" fill="#1E3A8A">c4_indexer</text>
  <text x="360" y="280" text-anchor="middle" font-size="11.5" fill="#1E40AF">稀疏选择打分</text>
  <text x="360" y="302" text-anchor="middle" font-size="11.5" fill="#1E40AF">用的 K</text>

  <rect x="470" y="222" width="180" height="96" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="560" y="254" text-anchor="middle" font-size="12.5" class="mono" fill="#1E3A8A">swa</text>
  <text x="560" y="280" text-anchor="middle" font-size="11.5" fill="#1E40AF">滑窗内的 KV</text>
  <text x="560" y="302" text-anchor="middle" font-size="11.5" fill="#1E40AF">不随上下文增长</text>

  <rect x="670" y="222" width="180" height="96" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="760" y="254" text-anchor="middle" font-size="12.5" class="mono" fill="#7F1D1D">c4_state</text>
  <text x="760" y="280" text-anchor="middle" font-size="11.5" fill="#991B1B">C4 层压缩器的</text>
  <text x="760" y="302" text-anchor="middle" font-size="11.5" fill="#991B1B">滚动快照</text>

  <!-- brackets -->
  <line x1="70" y1="334" x2="70" y2="354" stroke="#93C5FD" stroke-width="1.4"/>
  <line x1="70" y1="354" x2="650" y2="354" stroke="#93C5FD" stroke-width="1.4"/>
  <line x1="650" y1="354" x2="650" y2="334" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="360" y="374" text-anchor="middle" font-size="12" fill="#1E40AF">前三类都是 KV，会随前缀匹配走</text>

  <line x1="670" y1="334" x2="670" y2="354" stroke="#FCA5A5" stroke-width="1.4"/>
  <line x1="670" y1="354" x2="850" y2="354" stroke="#FCA5A5" stroke-width="1.4"/>
  <line x1="850" y1="354" x2="850" y2="334" stroke="#FCA5A5" stroke-width="1.4"/>
  <text x="760" y="374" text-anchor="middle" font-size="12" fill="#B91C1C">不是 KV</text>

  <!-- takeaway -->
  <rect x="60" y="392" width="800" height="30" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="460" y="412" text-anchor="middle" font-size="12.5" fill="#92400E">缺任何一份，这段前缀就用不了：attention 读到的会是错的答案</text>
</svg>
