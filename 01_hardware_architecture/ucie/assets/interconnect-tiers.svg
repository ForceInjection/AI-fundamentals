<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1080" height="620" fill="#FBF8F1"/>
  <text x="70" y="66" font-size="34" font-weight="bold" fill="#2b2b2b">互连的三层版图:距离决定一切</text>
  <text x="70" y="100" font-size="18" fill="#7a7368">能耗(pJ/bit)随距离跳变;每层守一段,谁也替代不了谁</text>

  <!-- 三条横带:封装内 / 板级 / 机柜 -->
  <g>
    <rect x="90" y="150" width="900" height="110" rx="8" fill="#EAF2FB" stroke="#3D6DB5" stroke-width="2"/>
    <text x="110" y="185" font-size="22" font-weight="bold" fill="#3D6DB5">封装内(die-to-die,mm 级)</text>
    <text x="110" y="215" font-size="17" fill="#2b2b2b">UCIe / BoW / 私有 die-to-die — 能效 0.25–1 pJ/bit — 口径:边缘带宽密度(GB/s/mm)</text>
    <text x="110" y="243" font-size="16" fill="#7a7368">UCIe 4.0:UCIe.mem 内存语义 + 安全管理 → 向上侵入内存语义层</text>
  </g>
  <g>
    <rect x="90" y="285" width="900" height="110" rx="8" fill="#FDF3E3" stroke="#C88A2D" stroke-width="2"/>
    <text x="110" y="320" font-size="22" font-weight="bold" fill="#B87A1D">板级/模块内(dm 级)</text>
    <text x="110" y="350" font-size="17" fill="#2b2b2b">NVLink 5(1.8 TB/s/GPU)/ NVLink-C2C — ~1.3 pJ/bit — Fusion 半开放</text>
    <text x="110" y="378" font-size="16" fill="#7a7368">PCIe 也主要活在这一层(主板走线);PCIe 7.0 x16 = 512 GB/s</text>
  </g>
  <g>
    <rect x="90" y="420" width="900" height="110" rx="8" fill="#F2EFEA" stroke="#8a8378" stroke-width="2"/>
    <text x="110" y="455" font-size="22" font-weight="bold" fill="#6b6558">板级/跨机(m 级)</text>
    <text x="110" y="485" font-size="17" fill="#2b2b2b">PCIe 7.0(128 GT/s,x16 512 GB/s)/ Ethernet / CXL over PCIe — 数 pJ/bit 起</text>
    <text x="110" y="513" font-size="16" fill="#7a7368">CXL.mem 在这一层给内存池化语义——与封装内的 UCIe.mem 隔层相望</text>
  </g>

  <!-- 左侧能耗箭头 -->
  <g>
    <line x1="60" y1="530" x2="60" y2="150" stroke="#D9483B" stroke-width="2.5"/>
    <path d="M 60 150 L 54 165 L 66 165 Z" fill="#D9483B"/>
    <text x="42" y="350" font-size="17" fill="#D9483B" transform="rotate(-90 42 350)">能耗成本(pJ/bit)向封装内递减</text>
  </g>

  <text x="70" y="575" font-size="17" fill="#5b5344">UCIe 4.0 的位置:封装内这一层长出了内存语义与信任管理——开始与板级语义层交界。</text>
</svg>
