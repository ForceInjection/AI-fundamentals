<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="'MiSans','PingFang SC','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="58" fill="#e2e8f0" font-size="26" font-weight="700">LLM Token 支出指数：先涨一倍，再腰斩跌破 1 美元</text>
  <text x="60" y="92" fill="#94a3b8" font-size="15">每百万 token 的实际平均支付价格（用量加权）· Silicon Data 编制 · Bloomberg: SDLLMTK · 2025-12 发布 → 2026-09</text>

  <!-- 图表区：y $0.8–$2.2 -->
  <g transform="translate(90,130)">
    <!-- 网格 -->
    <line x1="0" y1="0" x2="900" y2="0" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="91" x2="900" y2="91" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="183" x2="900" y2="183" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="274" x2="900" y2="274" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="366" x2="900" y2="366" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="457" x2="900" y2="457" stroke="#334155" stroke-width="1"/>
    <!-- y 轴标签：$2.2→$0.8，间距 91.4/格？用 y0=0($2.2) y457($0.8)：每 $0.1 = 457/14=32.6 -->
    <text x="-14" y="8" fill="#94a3b8" font-size="14" text-anchor="end">$2.2</text>
    <text x="-14" y="108" fill="#94a3b8" font-size="14" text-anchor="end">$1.8</text>
    <text x="-14" y="207" fill="#94a3b8" font-size="14" text-anchor="end">$1.4</text>
    <text x="-14" y="307" fill="#94a3b8" font-size="14" text-anchor="end">$1.0</text>
    <text x="-14" y="406" fill="#94a3b8" font-size="14" text-anchor="end">$0.6</text>
    <text x="450" y="492" fill="#64748b" font-size="13" text-anchor="middle">2025-12（发布）  2026-02  2026-04  2026-05（峰值）  2026-07  2026-08  2026-09</text>

    <!-- 数据点映射：y($v) = 457 - (v-0.6)*163.2；x(t)：2025-12=0 … 2026-09=900（9.5 个月，每月 ~94.7） -->
    <!-- $1.09@12月(0) → $2.12@5月(5m,474) → $1.62@7月(7m,663) → $1.02@8月(8.3m,786) → $0.97@9月1(9.2m,871) -->
    <!-- y: 1.09→457-80=377; 2.12→457-248=209; 1.62→457-166=291; 1.02→457-68.5=389; 0.97→457-60=397 -->

    <!-- $1 参考线 -->
    <line x1="0" y1="389" x2="900" y2="389" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.85"/>
    <text x="900" y="381" fill="#f59e0b" font-size="13" text-anchor="end" font-weight="600">$1 关口</text>

    <!-- 面积填充 -->
    <path d="M 0,377 L 110,340 Q 300,225 474,209 Q 620,250 663,291 Q 760,370 786,389 L 871,397 L 900,397 L 900,457 L 0,457 Z" fill="url(#fill)"/>
    <!-- 主曲线 -->
    <path d="M 0,377 C 120,320 350,215 474,209 C 560,225 620,265 663,291 C 720,345 750,375 786,389 C 830,395 855,397 871,397"
          fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- 发布点 $1.09 -->
    <circle cx="0" cy="377" r="6" fill="#38bdf8"/>
    <text x="0" y="356" fill="#e2e8f0" font-size="13" font-weight="600">发布 $1.09（2025-12）</text>

    <!-- 峰值 $2.12（2026-05） -->
    <circle cx="474" cy="209" r="9" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
    <line x1="474" y1="209" x2="474" y2="457" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
    <text x="474" y="188" fill="#7dd3fc" font-size="16" text-anchor="middle" font-weight="800">峰值 $2.12（2026-05）</text>
    <text x="474" y="240" fill="#7dd3fc" font-size="12" text-anchor="middle">Agent 负载推高，近翻倍</text>

    <!-- 7 月 $1.62 -->
    <circle cx="663" cy="291" r="5" fill="#38bdf8"/>
    <text x="663" y="276" fill="#cbd5e1" font-size="12" text-anchor="middle">$1.62</text>
    <!-- 8 月 $1.02 -->
    <circle cx="786" cy="389" r="5" fill="#38bdf8"/>
    <text x="786" y="415" fill="#cbd5e1" font-size="12" text-anchor="middle">$1.02（8 月）</text>

    <!-- 最新 $0.97 -->
    <circle cx="871" cy="397" r="11" fill="#f59e0b" stroke="#0f172a" stroke-width="3"/>
    <line x1="871" y1="397" x2="871" y2="457" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
    <text x="871" y="365" fill="#fbbf24" font-size="17" text-anchor="end" font-weight="800">$0.97 历史新低</text>
    <text x="871" y="432" fill="#fbbf24" font-size="13" text-anchor="end">2026-09-01 首次跌破 $1</text>

    <!-- 腰斩标注 -->
    <line x1="474" y1="228" x2="780" y2="380" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.8"/>
    <text x="600" y="330" fill="#f472b6" font-size="14" font-weight="700">较高点 −54%（腰斩）</text>
  </g>

  <text x="90" y="648" fill="#64748b" font-size="13">数据锚点：发布 $1.09（2025-12）→ 峰值 $2.12（2026-05）→ $1.62（2026-07-03）→ $1.02（2026-08）→ $0.97（2026-09-01，近 7 天 −8.6%）</text>
</svg>
